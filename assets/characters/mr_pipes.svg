<svg xmlns="http://www.w3.org/2000/svg" width="320" height="540" viewBox="0 0 320 540">
  <!-- Mr. Pipes - authentic high-vis septic professional based on photo reference -->
  <ellipse cx="160" cy="525" rx="60" ry="12" fill="#00000022"/>
  
  <!-- Legs / Pants (orange) -->
  <rect x="115" y="340" width="40" height="165" rx="10" fill="#EF6C00"/>
  <rect x="165" y="340" width="40" height="165" rx="10" fill="#EF6C00"/>
  <!-- Reflective stripes on legs -->
  <rect x="115" y="420" width="40" height="8" fill="#FFFFFF" opacity="0.8"/>
  <rect x="165" y="420" width="40" height="8" fill="#FFFFFF" opacity="0.8"/>
  <!-- Boots -->
  <rect x="108" y="490" width="52" height="28" rx="6" fill="#212121"/>
  <rect x="160" y="490" width="52" height="28" rx="6" fill="#212121"/>
  
  <!-- Body / High-vis jacket -->
  <rect x="90" y="185" width="140" height="165" rx="16" fill="#F57C00"/>
  <!-- Reflective stripes -->
  <rect x="90" y="240" width="140" height="10" fill="#FFFFFF" opacity="0.85"/>
  <rect x="90" y="280" width="140" height="10" fill="#FFFFFF" opacity="0.85"/>
  <!-- Zipper / front -->
  <rect x="155" y="195" width="10" height="140" fill="#E65100"/>
  <!-- Harness straps suggestion -->
  <path d="M110 200 L100 320" stroke="#37474F" stroke-width="6" fill="none"/>
  <path d="M210 200 L220 320" stroke="#37474F" stroke-width="6" fill="none"/>
  
  <!-- Arms -->
  <g id="arm_l">
    <rect x="45" y="195" width="48" height="130" rx="16" fill="#F57C00"/>
    <!-- Glove -->
    <rect x="40" y="310" width="55" height="40" rx="12" fill="#212121"/>
  </g>
  <g id="arm_r">
    <rect x="227" y="195" width="48" height="130" rx="16" fill="#F57C00"/>
    <!-- Glove -->
    <rect x="225" y="310" width="55" height="40" rx="12" fill="#212121"/>
  </g>
  
  <!-- Neck -->
  <rect x="135" y="160" width="50" height="30" fill="#FFCC80"/>
  
  <!-- Head -->
  <g id="head">
    <ellipse cx="160" cy="110" rx="58" ry="62" fill="#FFE0B2"/>
    <!-- Hair (short, slightly greyish) -->
    <path d="M105 95 Q110 50 160 45 Q210 50 215 95" fill="#78909C"/>
    <!-- Friendly face -->
    <ellipse cx="140" cy="105" rx="8" ry="10" fill="#263238"/>
    <ellipse cx="180" cy="105" rx="8" ry="10" fill="#263238"/>
    <circle cx="142" cy="102" r="2.5" fill="#FFFFFF"/>
    <circle cx="182" cy="102" r="2.5" fill="#FFFFFF"/>
    <!-- Smile -->
    <path d="M140 140 Q160 158 180 140" fill="none" stroke="#5D4037" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Hard hat (orange) -->
  <ellipse cx="160" cy="55" rx="70" ry="22" fill="#EF6C00"/>
  <path d="M95 60 Q100 20 160 15 Q220 20 225 60" fill="#F57C00"/>
  <!-- Headlamp -->
  <circle cx="160" cy="35" r="14" fill="#37474F"/>
  <circle cx="160" cy="35" r="8" fill="#FFF59D"/>
  <circle cx="160" cy="35" r="4" fill="#FFFFFF"/>
  
  <!-- Mouth group for lip-sync -->
  <g id="mouth">
    <ellipse cx="160" cy="145" rx="16" ry="6" fill="#5D4037" opacity="0.3"/>
  </g>
</svg>