<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="280" height="500" viewBox="0 0 280 500">
  <!-- Unified Style v2 - Mr. Pipes -->
  <!-- Soft flat educational cartoon, medium line weight, original faces -->
  <ellipse cx="140" cy="485" rx="55" ry="10" fill="#00000018"/>
  
  <!-- Legs -->
  <rect x="95" y="320" width="30" height="150" rx="8" fill="#455A64" stroke="#37474F" stroke-width="2"/>
  <rect x="155" y="320" width="30" height="150" rx="8" fill="#455A64" stroke="#37474F" stroke-width="2"/>
  <rect x="88" y="460" width="42" height="22" rx="5" fill="#3E2723" stroke="#2E1B10" stroke-width="2"/>
  <rect x="150" y="460" width="42" height="22" rx="5" fill="#3E2723" stroke="#2E1B10" stroke-width="2"/>
  
  <!-- Body -->
  <rect x="80" y="175" width="120" height="155" rx="14" fill="#1565C0" stroke="#0D47A1" stroke-width="2.5"/>
  <path d="M95 180 L140 198 L185 180" fill="none" stroke="#0D47A1" stroke-width="5"/>
  <rect x="155" y="215" width="30" height="24" rx="3" fill="#0D47A1"/>
  <rect x="80" y="315" width="120" height="12" fill="#5D4037" stroke="#4E342E" stroke-width="1.5"/>
  
  <!-- Arms -->
  <rect x="40" y="185" width="38" height="105" rx="14" fill="#1565C0" stroke="#0D47A1" stroke-width="2"/>
  <circle cx="59" cy="295" r="16" fill="#FFCC80" stroke="#E0A060" stroke-width="2"/>
  <rect x="202" y="185" width="38" height="105" rx="14" fill="#1565C0" stroke="#0D47A1" stroke-width="2"/>
  <circle cx="221" cy="295" r="16" fill="#FFCC80" stroke="#E0A060" stroke-width="2"/>
  
  <!-- Neck -->
  <rect x="120" y="155" width="40" height="25" fill="#FFCC80" stroke="#E0A060" stroke-width="1.5"/>
  
  <!-- Head - unified construction -->
  <g id="head">
    <!-- Soft rounded head -->
    <ellipse cx="140" cy="105" rx="55" ry="60" fill="#FFE0B2" stroke="#E0A060" stroke-width="2.5"/>
    <!-- Simple hair -->
    <path d="M90 85 Q95 40 140 35 Q185 40 190 85" fill="#5D4037" stroke="#4E342E" stroke-width="2"/>
    <!-- Eyes - same style for all characters -->
    <ellipse cx="120" cy="100" rx="7" ry="9" fill="#263238"/>
    <ellipse cx="160" cy="100" rx="7" ry="9" fill="#263238"/>
    <circle cx="122" cy="97" r="2.5" fill="#fff"/>
    <circle cx="162" cy="97" r="2.5" fill="#fff"/>
    <!-- Simple brows -->
    <path d="M108 88 Q120 84 130 88" fill="none" stroke="#4E342E" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M150 88 Q160 84 172 88" fill="none" stroke="#4E342E" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Reduced nose -->
    <path d="M140 108 L136 125 L144 125" fill="none" stroke="#E0A060" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Simple smile -->
    <path d="M122 140 Q140 152 158 140" fill="none" stroke="#5D4037" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Mouth for lip sync -->
  <g id="mouth"></g>
</svg>