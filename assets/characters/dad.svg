<svg xmlns="http://www.w3.org/2000/svg" width="300" height="520" viewBox="0 0 300 520">
  <!-- Dad / Homeowner - broad, proud, cowboy hat, flannel -->
  <ellipse cx="150" cy="505" rx="60" ry="12" fill="#00000022"/>
  
  <!-- Legs / Jeans -->
  <rect x="100" y="330" width="42" height="160" rx="10" fill="#1565C0"/>
  <rect x="158" y="330" width="42" height="160" rx="10" fill="#1565C0"/>
  <!-- Boots -->
  <rect x="92" y="475" width="55" height="25" rx="6" fill="#3E2723"/>
  <rect x="153" y="475" width="55" height="25" rx="6" fill="#3E2723"/>
  
  <!-- Body / Red Flannel -->
  <rect x="80" y="175" width="140" height="165" rx="16" fill="#C62828"/>
  <!-- Flannel lines -->
  <line x1="100" y1="185" x2="100" y2="330" stroke="#B71C1C" stroke-width="5"/>
  <line x1="130" y1="185" x2="130" y2="330" stroke="#B71C1C" stroke-width="5"/>
  <line x1="160" y1="185" x2="160" y2="330" stroke="#B71C1C" stroke-width="5"/>
  <line x1="190" y1="185" x2="190" y2="330" stroke="#B71C1C" stroke-width="5"/>
  <!-- Belt -->
  <rect x="80" y="325" width="140" height="16" fill="#5D4037"/>
  
  <!-- Arms -->
  <g id="arm_l">
    <rect x="40" y="185" width="45" height="125" rx="16" fill="#C62828"/>
    <circle cx="62" cy="315" r="19" fill="#FFCC80"/>
  </g>
  <g id="arm_r">
    <rect x="215" y="185" width="45" height="125" rx="16" fill="#C62828"/>
    <circle cx="238" cy="315" r="19" fill="#FFCC80"/>
  </g>
  
  <!-- Neck -->
  <rect x="128" y="155" width="44" height="28" fill="#FFCC80"/>
  
  <!-- Head -->
  <g id="head">
    <ellipse cx="150" cy="110" rx="60" ry="65" fill="#FFE0B2"/>
    <!-- Blonde hair -->
    <path d="M92 95 Q100 40 150 35 Q200 40 208 95" fill="#F9A825"/>
    <path d="M100 100 Q110 60 150 55 Q190 60 200 100" fill="#FBC02D"/>
    <!-- Cowboy hat -->
    <ellipse cx="150" cy="55" rx="85" ry="18" fill="#6D4C41"/>
    <rect x="95" y="25" width="110" height="35" rx="8" fill="#5D4037"/>
    <ellipse cx="150" cy="28" rx="55" ry="12" fill="#6D4C41"/>
    <!-- Eyes -->
    <ellipse cx="128" cy="105" rx="9" ry="11" fill="#263238"/>
    <ellipse cx="172" cy="105" rx="9" ry="11" fill="#263238"/>
    <!-- Confident smile -->
    <path d="M128 145 Q150 162 172 145" fill="none" stroke="#5D4037" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <g id="mouth">
    <ellipse cx="150" cy="150" rx="16" ry="6" fill="#5D4037" opacity="0.3"/>
  </g>
</svg>