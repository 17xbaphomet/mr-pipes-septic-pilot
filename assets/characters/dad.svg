<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="520" viewBox="0 0 300 520">
  <!-- Dad - final unified soft style matching Mr. Pipes V2 -->
  <ellipse cx="150" cy="505" rx="55" ry="10" fill="#00000018"/>
  
  <!-- Legs / Jeans -->
  <rect x="100" y="330" width="38" height="155" rx="9" fill="#1565C0" stroke="#0D47A1" stroke-width="2"/>
  <rect x="162" y="330" width="38" height="155" rx="9" fill="#1565C0" stroke="#0D47A1" stroke-width="2"/>
  <!-- Boots -->
  <rect x="92" y="475" width="52" height="25" rx="5" fill="#3E2723" stroke="#2E1B10" stroke-width="2"/>
  <rect x="156" y="475" width="52" height="25" rx="5" fill="#3E2723" stroke="#2E1B10" stroke-width="2"/>
  
  <!-- Body / Red Flannel -->
  <rect x="82" y="180" width="136" height="160" rx="14" fill="#C62828" stroke="#B71C1C" stroke-width="2.5"/>
  <!-- Soft flannel lines -->
  <line x1="105" y1="190" x2="105" y2="325" stroke="#B71C1C" stroke-width="4"/>
  <line x1="135" y1="190" x2="135" y2="325" stroke="#B71C1C" stroke-width="4"/>
  <line x1="165" y1="190" x2="165" y2="325" stroke="#B71C1C" stroke-width="4"/>
  <line x1="195" y1="190" x2="195" y2="325" stroke="#B71C1C" stroke-width="4"/>
  <!-- Belt -->
  <rect x="82" y="325" width="136" height="14" fill="#5D4037" stroke="#4E342E" stroke-width="1.5"/>
  
  <!-- Arms -->
  <rect x="42" y="190" width="42" height="115" rx="14" fill="#C62828" stroke="#B71C1C" stroke-width="2"/>
  <circle cx="63" cy="310" r="17" fill="#FFCC80" stroke="#E0A060" stroke-width="2"/>
  <rect x="216" y="190" width="42" height="115" rx="14" fill="#C62828" stroke="#B71C1C" stroke-width="2"/>
  <circle cx="237" cy="310" r="17" fill="#FFCC80" stroke="#E0A060" stroke-width="2"/>
  
  <!-- Neck -->
  <rect x="125" y="155" width="50" height="28" fill="#FFCC80" stroke="#E0A060" stroke-width="1.5"/>
  
  <!-- Head - matching Mr. Pipes construction -->
  <g id="head">
    <ellipse cx="150" cy="105" rx="55" ry="58" fill="#FFE0B2" stroke="#E0A060" stroke-width="2.5"/>
    <!-- Blonde hair -->
    <path d="M95 85 Q100 40 150 35 Q200 40 205 85" fill="#F9A825" stroke="#F57F17" stroke-width="2"/>
    <!-- Eyes - same style as Mr. Pipes -->
    <ellipse cx="130" cy="100" rx="7" ry="9" fill="#263238"/>
    <ellipse cx="170" cy="100" rx="7" ry="9" fill="#263238"/>
    <circle cx="132" cy="97" r="2.5" fill="#fff"/>
    <circle cx="172" cy="97" r="2.5" fill="#fff"/>
    <!-- Soft brows -->
    <path d="M118 88 Q130 84 140 88" fill="none" stroke="#5D4037" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M160 88 Q170 84 182 88" fill="none" stroke="#5D4037" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Reduced nose -->
    <path d="M150 108 L146 125 L154 125" fill="none" stroke="#E0A060" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Soft confident smile -->
    <path d="M128 140 Q150 155 172 140" fill="none" stroke="#5D4037" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Cowboy hat (strong silhouette) -->
  <ellipse cx="150" cy="48" rx="80" ry="16" fill="#6D4C41" stroke="#5D4037" stroke-width="2"/>
  <rect x="100" y="22" width="100" height="30" rx="6" fill="#5D4037" stroke="#4E342E" stroke-width="2"/>
  <ellipse cx="150" cy="25" rx="50" ry="10" fill="#6D4C41"/>
  
  <g id="mouth"></g>
</svg>