<svg xmlns="http://www.w3.org/2000/svg" width="260" height="480" viewBox="0 0 260 480">
  <!-- Teen daughter -->
  <ellipse cx="130" cy="468" rx="45" ry="10" fill="#00000022"/>
  
  <!-- Legs -->
  <rect x="95" y="300" width="28" height="150" rx="8" fill="#1565C0"/>
  <rect x="137" y="300" width="28" height="150" rx="8" fill="#1565C0"/>
  <!-- Shoes -->
  <ellipse cx="109" cy="455" rx="20" ry="12" fill="#212121"/>
  <ellipse cx="151" cy="455" rx="20" ry="12" fill="#212121"/>
  
  <!-- Body / Top -->
  <rect x="80" y="160" width="100" height="150" rx="14" fill="#EC407A"/>
  
  <!-- Arms -->
  <g id="arm_l">
    <rect x="45" y="170" width="35" height="100" rx="12" fill="#FFE0B2"/>
    <circle cx="62" cy="275" r="15" fill="#FFCC80"/>
  </g>
  <g id="arm_r">
    <rect x="180" y="170" width="35" height="100" rx="12" fill="#FFE0B2"/>
    <circle cx="198" cy="275" r="15" fill="#FFCC80"/>
  </g>
  
  <!-- Neck -->
  <rect x="110" y="140" width="40" height="25" fill="#FFCC80"/>
  
  <!-- Head -->
  <g id="head">
    <ellipse cx="130" cy="95" rx="52" ry="58" fill="#FFE0B2"/>
    <!-- Long hair -->
    <path d="M78 90 Q85 25 130 20 Q175 25 182 90" fill="#4E342E"/>
    <path d="M75 100 Q80 50 130 45 Q180 50 185 100" fill="#5D4037"/>
    <path d="M70 120 Q60 180 75 250" fill="#5D4037"/>
    <path d="M190 120 Q200 180 185 250" fill="#5D4037"/>
    <!-- Eyes -->
    <ellipse cx="112" cy="90" rx="8" ry="10" fill="#263238"/>
    <ellipse cx="148" cy="90" rx="8" ry="10" fill="#263238"/>
    <!-- Slight smile -->
    <path d="M115 130 Q130 142 145 130" fill="none" stroke="#5D4037" stroke-width="3"/>
  </g>
  
  <g id="mouth">
    <ellipse cx="130" cy="135" rx="12" ry="5" fill="#5D4037" opacity="0.3"/>
  </g>
</svg>