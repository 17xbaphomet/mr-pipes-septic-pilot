<svg xmlns="http://www.w3.org/2000/svg" width="280" height="480" viewBox="0 0 280 480">
  <!-- Mid-child - unified soft style with headphones -->
  <ellipse cx="140" cy="465" rx="50" ry="10" fill="#00000022"/>
  <!-- Legs -->
  <rect x="105" y="290" width="32" height="155" rx="10" fill="#1565C0"/>
  <rect x="143" y="290" width="32" height="155" rx="10" fill="#1565C0"/>
  <!-- Shoes -->
  <ellipse cx="121" cy="450" rx="22" ry="13" fill="#212121"/>
  <ellipse cx="159" cy="450" rx="22" ry="13" fill="#212121"/>
  <!-- Body -->
  <rect x="90" y="175" width="100" height="125" rx="14" fill="#42A5F5"/>
  <!-- Arms -->
  <rect x="50" y="185" width="42" height="100" rx="14" fill="#42A5F5"/>
  <rect x="188" y="185" width="42" height="100" rx="14" fill="#42A5F5"/>
  <!-- Hands -->
  <ellipse cx="71" cy="290" rx="16" ry="14" fill="#FFCC80"/>
  <ellipse cx="209" cy="290" rx="16" ry="14" fill="#FFCC80"/>
  <!-- Neck -->
  <rect x="120" y="150" width="40" height="30" fill="#FFCC80"/>
  <!-- Head -->
  <ellipse cx="140" cy="105" rx="48" ry="52" fill="#FFE0B2"/>
  <!-- Hair -->
  <path d="M95 95 Q100 45 140 40 Q180 45 185 95" fill="#5D4037"/>
  <!-- Big headphones (key silhouette) -->
  <rect x="70" y="75" width="25" height="55" rx="10" fill="#212121"/>
  <rect x="185" y="75" width="25" height="55" rx="10" fill="#212121"/>
  <path d="M95 80 Q140 55 185 80" fill="none" stroke="#212121" stroke-width="12"/>
  <!-- Face -->
  <ellipse cx="123" cy="100" rx="6.5" ry="8" fill="#263238"/>
  <ellipse cx="157" cy="100" rx="6.5" ry="8" fill="#263238"/>
  <circle cx="125" cy="97" r="2" fill="#FFFFFF"/>
  <circle cx="159" cy="97" r="2" fill="#FFFFFF"/>
  <!-- Neutral / slight smile -->
  <path d="M123 128 Q140 140 157 128" fill="none" stroke="#5D4037" stroke-width="3" stroke-linecap="round"/>
