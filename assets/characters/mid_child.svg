<svg xmlns="http://www.w3.org/2000/svg" width="260" height="420" viewBox="0 0 260 420">
  <!-- Mid-child boy with headphones, slightly chubby -->
  <ellipse cx="130" cy="408" rx="50" ry="10" fill="#00000022"/>
  
  <!-- Legs -->
  <rect x="95" y="270" width="32" height="120" rx="10" fill="#1565C0"/>
  <rect x="133" y="270" width="32" height="120" rx="10" fill="#1565C0"/>
  <!-- Shoes -->
  <ellipse cx="111" cy="395" rx="22" ry="12" fill="#212121"/>
  <ellipse cx="149" cy="395" rx="22" ry="12" fill="#212121"/>
  
  <!-- Body (slightly wider) -->
  <rect x="70" y="145" width="120" height="135" rx="20" fill="#43A047"/>
  <!-- Long shirt detail -->
  <rect x="70" y="250" width="120" height="30" fill="#2E7D32"/>
  
  <!-- Arms -->
  <g id="arm_l">
    <rect x="40" y="155" width="35" height="95" rx="14" fill="#43A047"/>
    <circle cx="57" cy="255" r="16" fill="#FFCC80"/>
  </g>
  <g id="arm_r">
    <rect x="185" y="155" width="35" height="95" rx="14" fill="#43A047"/>
    <circle cx="203" cy="255" r="16" fill="#FFCC80"/>
  </g>
  
  <!-- Neck -->
  <rect x="110" y="125" width="40" height="25" fill="#FFCC80"/>
  
  <!-- Head -->
  <g id="head">
    <ellipse cx="130" cy="85" rx="55" ry="58" fill="#FFE0B2"/>
    <!-- Hair -->
    <path d="M78 80 Q85 30 130 25 Q175 30 182 80" fill="#5D4037"/>
    <!-- Headphones -->
    <rect x="70" y="70" width="18" height="40" rx="6" fill="#212121"/>
    <rect x="172" y="70" width="18" height="40" rx="6" fill="#212121"/>
    <path d="M88 75 Q130 50 172 75" fill="none" stroke="#212121" stroke-width="8"/>
    <!-- Eyes -->
    <ellipse cx="112" cy="85" rx="8" ry="10" fill="#263238"/>
    <ellipse cx="148" cy="85" rx="8" ry="10" fill="#263238"/>
    <!-- Neutral mouth -->
    <ellipse cx="130" cy="120" rx="12" ry="5" fill="#5D4037"/>
  </g>
  
  <g id="mouth">
    <ellipse cx="130" cy="120" rx="12" ry="5" fill="#5D4037" opacity="0.4"/>
  </g>
</svg>