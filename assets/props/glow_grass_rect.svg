<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200">
  <defs>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="20" y="30" width="360" height="140" rx="8" fill="#76FF03" opacity="0.35" filter="url(#softGlow)"/>
  <rect id="glow_core" x="40" y="45" width="320" height="110" rx="4" fill="#B2FF59" opacity="0.85"/>
  <g stroke="#64DD17" stroke-width="1" opacity="0.5">
    <line x1="40" y1="70" x2="360" y2="70"/>
    <line x1="40" y1="95" x2="360" y2="95"/>
    <line x1="40" y1="120" x2="360" y2="120"/>
    <line x1="100" y1="45" x2="100" y2="155"/>
    <line x1="160" y1="45" x2="160" y2="155"/>
    <line x1="220" y1="45" x2="220" y2="155"/>
    <line x1="280" y1="45" x2="280" y2="155"/>
  </g>
</svg>
