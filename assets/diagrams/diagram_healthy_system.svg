<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FAFAFA"/>
  <text x="400" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#2E7D32">Healthy Septic System</text>
  <!-- Tank -->
  <rect x="80" y="120" width="200" height="160" rx="10" fill="#E0F7FA" stroke="#00838F" stroke-width="4"/>
  <text x="180" y="100" text-anchor="middle" font-size="14" fill="#00695C">Septic Tank</text>
  <!-- Arrow -->
  <path d="M290 200 L360 200" stroke="#43A047" stroke-width="6" marker-end="url(#arrow)"/>
  <!-- Drainfield -->
  <rect x="380" y="100" width="340" height="200" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/>
  <text x="550" y="80" text-anchor="middle" font-size="14" fill="#1B5E20">Drainfield (healthy soil)</text>
  <!-- Pipes -->
  <line x1="400" y1="150" x2="700" y2="150" stroke="#81C784" stroke-width="6"/>
  <line x1="400" y1="200" x2="700" y2="200" stroke="#81C784" stroke-width="6"/>
  <line x1="400" y1="250" x2="700" y2="250" stroke="#81C784" stroke-width="6"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#43A047"/>
    </marker>
  </defs>
  <!-- Checkmarks -->
  <text x="180" y="310" text-anchor="middle" font-size="16" fill="#2E7D32">✓ Solids stay in tank</text>
  <text x="550" y="340" text-anchor="middle" font-size="16" fill="#2E7D32">✓ Clean effluent treated by soil</text>
</svg>